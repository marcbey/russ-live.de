name: Deploy Production
on:
  workflow_run:
    workflows: ['Deploy Staging']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: 'Erfolgreicher Staging-Run mit geprüftem Image und Kompatibilitätsnachweis'
        required: true
        type: string
      mode:
        description: 'rollback: älteren geprüften Stand wählen; promote: neuesten Staging-Stand freigeben'
        required: true
        type: choice
        default: rollback
        options:
          - rollback
          - promote
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      packages: read
    defaults:
      run:
        working-directory: release-control
    env:
      BUILDX_BUILDER: default
      GH_TOKEN: ${{ github.token }}
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      digest: ${{ steps.release.outputs.digest }}
      manifest_sha256: ${{ steps.release.outputs.manifest_sha256 }}
      production_sha256: ${{ steps.release.outputs.production_sha256 }}
      staging_run_id: ${{ steps.release.outputs.staging_run_id }}
      mode: ${{ steps.release.outputs.mode }}
      control_commit: ${{ steps.release.outputs.control_commit }}
    steps:
      - name: Checkout trusted release controls
        uses: actions/checkout@v7
        with:
          ref: main
          path: release-control
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          working_directory: release-control
      - name: Check registry inspection CLI without starting a build worker
        run: docker buildx version
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate release and prepare production approval
        id: release
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: mise exec -- ruby script/ops/prepare_production.rb
  deploy:
    name: '${{ needs.prepare.outputs.mode }} ${{ needs.prepare.outputs.commit }}'
    needs: prepare
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
    defaults:
      run:
        working-directory: release-control
    env:
      # Match CI's cache path across the control and candidate checkouts.
      BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
      BUILDX_BUILDER: default
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted promotion helpers
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.control_commit }}
          path: release-control
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout the proven release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: release-candidate
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          working_directory: release-control
      - name: Restore trusted control dependencies
        uses: actions/cache/restore@v5
        with:
          path: vendor/bundle
          key: gems-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release-control/.ruby-version', 'release-control/Gemfile.lock') }}
      - name: Install the trusted runtime and dependencies
        run: |
          mise install
          mise exec -- bundle install
      - name: Check registry inspection CLI without starting a build worker
        run: docker buildx version
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote exact image under shared host lock
        env:
          RELEASE_CHECKOUT: ${{ github.workspace }}/release-candidate
          RELEASE_STAGING_RUN_ID: ${{ needs.prepare.outputs.staging_run_id }}
          RELEASE_EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_EXPECTED_DIGEST: ${{ needs.prepare.outputs.digest }}
          RELEASE_EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
          RELEASE_EXPECTED_PRODUCTION_SHA256: ${{ needs.prepare.outputs.production_sha256 }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          PRODUCTION_DOMAIN_MODE: ${{ vars.PRODUCTION_DOMAIN_MODE || 'legacy' }}
          SSL_CERTIFICATE_PEM: ${{ secrets.SSL_CERTIFICATE_PEM }}
          SSL_PRIVATE_KEY_PEM: ${{ secrets.SSL_PRIVATE_KEY_PEM }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          MEDIA_PROXY_SECRET: ${{ secrets.MEDIA_PROXY_SECRET }}
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          KAMAL_REGISTRY_PULL_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PULL_PASSWORD }}
          RUSS_LIVE_PRIMARY_DB_PASSWORD: ${{ secrets.RUSS_LIVE_PRIMARY_DB_PASSWORD }}
          RUSS_LIVE_OPERATIONAL_DB_PASSWORD: ${{ secrets.RUSS_LIVE_OPERATIONAL_DB_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: mise exec -- ruby script/ops/promote_release.rb
