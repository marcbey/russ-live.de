name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: 'Erfolgreicher Staging-Run mit geprüftem Image und Kompatibilitätsnachweis'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: live-deploy-${{ github.repository }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted promotion helpers
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate selected artifact source CI and registry digest
        id: release
        env:
          RELEASE_STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: mise exec -- ruby script/ops/resolve_release.rb
      - name: Checkout the proven release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install the release runtime and dependencies
        run: |
          mise install
          mise exec -- bundle install
      - name: Promote exact image under shared host lock
        env:
          PRODUCTION_DOMAIN_MODE: ${{ vars.PRODUCTION_DOMAIN_MODE || 'legacy' }}
          SSL_CERTIFICATE_PEM: ${{ secrets.SSL_CERTIFICATE_PEM }}
          SSL_PRIVATE_KEY_PEM: ${{ secrets.SSL_PRIVATE_KEY_PEM }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          MEDIA_PROXY_SECRET: ${{ secrets.MEDIA_PROXY_SECRET }}
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          KAMAL_REGISTRY_PULL_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PULL_PASSWORD }}
          RUSS_LIVE_PRIMARY_DB_PASSWORD: ${{ secrets.RUSS_LIVE_PRIMARY_DB_PASSWORD }}
          RUSS_LIVE_OPERATIONAL_DB_PASSWORD: ${{ secrets.RUSS_LIVE_OPERATIONAL_DB_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: mise exec -- ruby script/ops/promote_release.rb
