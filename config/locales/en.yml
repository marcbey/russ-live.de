  services:
    items:
      local:
        title: "We are the local promoter in the Stuttgart metropolitan region."
        paragraphs:
          first: "Every year, we bring a wide range of artists from rock, pop and entertainment to the stage, drawing on decades of experience as part of Konzertdirektion Russ."
          second: "The size of the event does not matter to us: from clubs to stadium concerts, we find the right venue, develop communication plans, handle ticket sales and provide the staff needed for a strong production. We also deliver business events and major public events professionally."
      production:
        title: "Production & Technology"
        paragraphs:
          first: "We know events from more than the perspective of a service provider. We stage them ourselves. Every year we deliver concerts, tours, festivals and corporate events, so we know exactly what matters in every phase of a project."
          second: "We bring this experience into the production of your event. Whether as a full-service partner or by taking over individual project areas, we work with our trusted network of technical and production partners to ensure professional, efficient and smooth delivery."
          third: "From the first planning meeting and technical concept through to show day, we support projects of every scale. We keep stage, lighting and sound in view, but above all the collaboration between everyone involved. A good production is one the audience barely notices."
      marketing:
        title: "Marketing"
        paragraphs:
          first: "Every event deserves the attention of its audience. Successful event marketing starts with the right strategy. Together we define your target audience, develop the right communication strategy and make sure your event reaches exactly the people you want to reach. From the first idea to a sold-out show, we support the entire marketing process with creativity, focus and many years of event experience."
          conclusion: "With our know-how, creative ideas and a strong regional network, we develop tailored marketing concepts that build reach, create attention and help events succeed sustainably."
        focus_title: "Our focus areas"
        focus_areas:
          - title: "Social Media & Performance Marketing"
            text: "We develop targeted campaigns for the relevant social media channels and use performance marketing on platforms such as Meta and Google, reaching your audience efficiently with measurable results."
          - title: "Poster and Print Campaigns"
            text: "From large-format posters, city-light posters, flyers and ads to other classic advertising formats, we plan, coordinate and support measures that make your event visible throughout the city."
          - title: "Press and Public Relations"
            text: "We maintain contact with regional media, create press information and help your event receive the attention it deserves. Our customers also receive regular event information through our newsletter."
          - title: "Local Cooperations & Partnerships"
            text: "With our strong network in Stuttgart and the region, we create valuable cooperations with companies, institutions and multipliers to increase your event's reach."
          - title: "Own Sales Channels & Ticket Platforms"
            text: "Alongside established ticket platforms, we also use our own sales channels to position your event effectively and generate additional reach."
          - title: "Content Production"
            text: "Professional content is the foundation of every successful campaign. Our in-house graphic designer creates artwork, social media graphics, ads, banners and other advertising materials quickly, flexibly and from a single source. On request, we also produce photo and video content for your event with our cooperation partners."
      staff:
        title: "Staffing"
        paragraphs:
          first: "Successful events are created by people. That is why our employees are at the center of everything we do. Whether setup and dismantling, logistics, catering, security or organization, every task contributes to a successful event."
          second: "With almost 500 of our own stagehands, forklift drivers, catering assistants and security staff, we have one of the largest event staffing pools in the region. Our team knows our workflows, works smoothly together and keeps event operations running reliably."
          third: "Fair working conditions and respectful interaction are a given for us. We pay our employees clearly above the statutory minimum wage and create a working environment shaped by appreciation, equal opportunity and mutual respect. Qualification, commitment and team spirit are what count for us."
          fourth: "Another focus is the continuous training and development of our team. Regular training on current safety and hygiene standards ensures a high level of quality and safe deployment at every event. Even on projects delivered together with external staffing providers, our customers benefit from the established workflows and experience of our own staff."
          fifth: "We are happy to support your event with qualified staff or take over the complete staff planning and coordination."
        deployment_title: "Our areas of deployment"
        deployment_areas:
          - "Catering assistants"
          - "Stagehands"
          - "Forklift drivers"
          - "Security staff"
      ticketing:
        title: "Ticket portal"
        cta: "Discover now!"
        paragraphs:
          first: "<strong>STUTTGART</strong>LIVE is our ticket portal for all major events in the Stuttgart region: online booking, quick, straightforward and with excellent service."
          second: "Event data will remain connected read-only in the long term. This Russ Live site will only use approved event data."
  pages:
    home:
      meta:
        title: "Russ Live | Cultural productions at the highest level"
        description: "Russ Live is a local promoter, production partner and full-service provider for live entertainment in Stuttgart and the region."
      hero:
        image_alt: "Golden guitar as the Russ Live key visual"
        intro_html: "We are your local promoter for Stuttgart. We always keep both artists and audiences in view. That is how we create unique emotional moments for up to 1 million visitors – every year."
      services:
        eyebrow: "Live Entertainment"
        title: "Full service for events"
        intro: "From local delivery to production, marketing, staffing and ticketing: Russ Live combines experience, network and execution."
        local_partners: "Including Live Nation, Karsten Jahnke Konzertdirektion, Wizard Live"
        more_info: "More info"
        summaries:
          production: "We bring our experience from our own concerts, tours, open-air formats and corporate events into every production. Together with our network, we ensure professional, efficient and smooth delivery."
          marketing: "We develop the right communication strategy and make sure your event reaches the right people. From social media and press relations to content production, we support the entire marketing process."
          staff: "With almost 500 of our own stagehands, forklift drivers, catering assistants and security staff, we have a strong staffing pool in the region. We can support individual deployments or handle complete staff planning."
          ticketing: "<strong>STUTTGART</strong>LIVE is our ticket portal for key events in the Stuttgart region: online booking, fast, straightforward and with excellent service."
