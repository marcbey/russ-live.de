    about:
      hero:
        eyebrow: "Über uns"
        title_lines:
          people: "Menschen."
          moments: "Momente."
          since: "Seit 1945."
        intro: "Aus Stuttgart. Für die Welt. Seit drei Generationen gestalten wir Konzerte, die verbinden."
      profile_title: "Unternehmensprofil"
      story:
        first_html: "Was 1945 mit einer Vision begann, ist heute eine der führenden Konzertdirektionen Europas. Von Stuttgart aus hat Russ über Jahrzehnte Konzertgeschichte mitgeprägt und sich gleichzeitig die Nähe zur Region bewahrt."
        second_html: "Diese Verbindung aus lokaler Verwurzelung und internationalem Anspruch prägt unseren Blick bis heute: Wir denken groß, arbeiten partnerschaftlich und behalten immer die Menschen hinter jeder Produktion im Fokus."
      company:
        eyebrow: "Konzertdirektion Russ"
        title_html: "Konzertdirektion Russ: Eine ganze Welt aus Konzerten, Künstlern und Events."
        intro: "Wir wollen Menschen glücklich machen."
        button: "Konzertdirektion"
        open_aria: "%{title} öffnen"
        areas:
          live: "Ob Club- oder Stadion-Konzerte, Musicals, Shows oder ihr nächstes Firmenevent. Wir sind ihr starker Partner."
          artists: "Ihr engagierter Partner bei der Suche nach Künstlern und Programmen, die Ihrem Veranstalterprofil entsprechen."
          service: "Wir sorgen für eine sichere Veranstaltung: Konzert, Tagung, Firmenfeier oder Konferenz."
          klassik: "Entdecken Sie bei uns die faszinierende Welt der klassischen Musik. Meisterkonzerte für Stuttgart. Seit 1945."
      history:
        eyebrow: "Geschichte"
        title: "Unsere Geschichte. Drei Generationen. Eine Haltung."
        image_alt: "Michaela Russ, Michael Russ und ein historisches Familienportrait"
        first: "Michael Russ ist mit einer ruhigen Nähe, viel Herz und echtem Unternehmergeist in die Welt von Russ Klassik gewachsen. Im Laufe der Jahre wurde daraus Verantwortung, Erfahrung und ein klarer Blick dafür, wie man Kultur dauerhaft möglich macht."
        second: "Michaela Russ führt diesen Weg in der dritten Generation weiter. Gemeinsam steht die Familie für Produktionen, die professionell organisiert sind und trotzdem menschlich bleiben. Daraus ist ein Team entstanden, das Kultur mit Haltung, Verlässlichkeit und Leidenschaft umsetzt."
      award:
        eyebrow: "Verantwortung"
        title: "Tradition ist für uns kein Rückblick, sondern Vertrauen in das, was als Nächstes kommt."
        image_alt: "Michael Russ Jr. mit Auszeichnung und Partner bei einer Preisverleihung"
        first: "Michael Russ erweitert die traditionsreiche Arbeit der Konzertdirektion Erwin Russ im Bereich Klassik um Pop, Rock, Shows und Entertainment. 2010 kommt Paul Woog als Geschäftsführer der Michael Russ GmbH hinzu. Gemeinsam entwickeln sie das Unternehmen weiter, bringen Künstlerinnen und Künstler auf die Bühne, realisieren eigene Veranstaltungskonzepte und schaffen mit Konzerten, Shows und Firmenevents besondere Erlebnisse für ihr Publikum."
        second: "Unsere Wurzeln liegen in Stuttgart, gleichzeitig arbeiten wir mit Künstlern und Partnern aus aller Welt zusammen. Durch unsere langjährige Erfahrung, kurze Wege und ein starkes Netzwerk können wir auch anspruchsvolle Projekte zuverlässig umsetzen – von der ersten Idee über Technik, Sicherheit, Marketing und Pressearbeit bis hin zu Ticketing und Personalplanung."
        third: "Unser Spektrum reicht dabei vom kleinen Clubkonzert über große Hallenshows bis hin zu spektakulären Open-Air-Veranstaltungen. Unterschiedliche Größenordnungen und Formate gehören für uns genauso zum Alltag wie die Herausforderung, für jedes Projekt den passenden Rahmen zu schaffen."
        fourth: "Seit 2025 erweitern auch Ausstellungen unser Portfolio. Den Anfang machte die Titanic-Ausstellung in Ludwigsburg. Damit entwickeln und realisieren wir neben Live-Veranstaltungen zunehmend auch Ausstellungskonzepte und erschließen neue Formen des kulturellen Erlebnisses."
        fifth: "Dabei geht es uns nicht nur um erfolgreiche Veranstaltungen. Wir möchten Kunst und Kultur langfristig stärken und legen großen Wert auf einen fairen und respektvollen Umgang mit Künstlern, Dienstleistern und Partnern. Nachhaltigkeit, Diversität, Gleichberechtigung und eine vertrauensvolle Zusammenarbeit gehören für uns selbstverständlich dazu."
      city:
        eyebrow: "Perspektive"
        title: "Von Stuttgart in die Welt."
        small_image_alt: "Historisches Konzertfoto von Ike und Tina Turner"
        large_image_alt: "Großveranstaltung in Stuttgart mit Oldtimer-Korso"
        first: "Ob in der Stuttgarter Liederhalle, auf den großen Festivalflächen, in Arenen oder Open-Air-Produktionen: Wir bringen Menschen zusammen. Live. Echt. Unvergesslich."
        second: "Die Stadt ist unser Ausgangspunkt, nicht unsere Grenze. Aus ihr heraus entwickeln wir Formate, die regional verankert sind und weit darüber hinaus wirken."
      closing:
        eyebrow: "Heute"
        title: "Tradition ist für uns kein Rückblick, sondern Vertrauen in das, was als Nächstes kommt."
        text: "Russ Live steht für Erfahrung ohne Stillstand, für Qualität ohne Attitüde und für Produktionen, die Kultur als gemeinsame Aufgabe begreifen."
