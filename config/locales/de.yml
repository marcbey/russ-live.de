  services:
    items:
      local:
        title: "Wir sind der örtliche Veranstalter in der Metropolregion Stuttgart."
        paragraphs:
          first: "Jedes Jahr bringen wir eine Vielzahl an Künstler*innen aus Rock, Pop und Unterhaltung auf die Bühne und können hierbei als Unternehmen der Konzertdirektion Russ auf eine langjährige Erfahrung zurückgreifen."
          second: "Dabei spielt die Größe der Veranstaltung für uns keine Rolle – wir finden von Club- bis hin zu Stadionkonzerten die optimale Location, erarbeiten passende Kommunikationspläne, kümmern uns um den Kartenverkauf und stellen mit unserem Personal die ideale Produktion sicher. Auch Businessevents oder öffentliche Großveranstaltungen werden mit uns professionell umgesetzt."
      production:
        title: "Produktion & Technik"
        paragraphs:
          first: "Wir kennen Veranstaltungen nicht nur aus der Perspektive eines Dienstleisters. Wir veranstalten sie selbst. Jedes Jahr realisieren wir Konzerte, Tourneen, Festivals und Firmenevents. Deshalb wissen wir genau, worauf es in jeder Phase eines Projekts ankommt."
          second: "Diese Erfahrung bringen wir auch in die Produktion Ihrer Veranstaltung ein. Ob als Full Service oder bei der Übernahme einzelner Projektbereiche sorgen wir gemeinsam mit unserem eingespielten Netzwerk aus Technik und Produktionspartnern für eine professionelle, wirtschaftliche und reibungslose Umsetzung."
          third: "Von der ersten Planungsbesprechung über die technische Konzeption bis zur Show begleiten wir Projekte jeder Größenordnung. Dabei behalten wir nicht nur Bühne, Licht und Ton im Blick, sondern vor allem das Zusammenspiel aller Beteiligten. Denn eine gute Produktion erkennt man daran, dass sie für das Publikum nahezu unsichtbar bleibt."
      marketing:
        title: "Marketing"
        paragraphs:
          first: "Jede Veranstaltung verdient die Aufmerksamkeit ihres Publikums. Erfolgreiches Eventmarketing beginnt mit der richtigen Strategie. Gemeinsam definieren wir Ihre Zielgruppe, entwickeln die passende Kommunikationsstrategie und sorgen dafür, dass Ihre Veranstaltung genau die Menschen erreicht, die Sie erreichen möchten. Von der ersten Idee bis zur ausverkauften Show begleiten wir den gesamten Marketingprozess - kreativ, zielgerichtet und mit langjähriger Erfahrung im Veranstaltungsbereich."
          conclusion: "Mit unserem Know-how, kreativen Ideen und einem starken regionalen Netzwerk entwickeln wir individuelle Marketingkonzepte, die Reichweite schaffen, Aufmerksamkeit erzeugen und Veranstaltungen nachhaltig erfolgreich machen."
        focus_title: "Unsere Fokusbereiche"
        focus_areas:
          - title: "Social Media & Performance Marketing"
            text: "Wir entwickeln zielgerichtete Kampagnen auf den relevanten Social-Media-Kanälen und setzen Performance-Marketing über Plattformen wie Meta und Google ein. So erreichen wir Ihre Zielgruppe effizient und mit messbaren Ergebnissen."
          - title: "Plakat- und Printkampagnen"
            text: "Ob Großflächenplakate, City-Light-Poster, Flyer oder Anzeigen - wir planen, koordinieren und begleiten klassische Werbemaßnahmen, die Ihre Veranstaltung im Stadtbild sichtbar machen."
          - title: "Presse- und Öffentlichkeitsarbeit"
            text: "Wir pflegen den Kontakt zu regionalen Medien, erstellen Presseinformationen und sorgen dafür, dass Ihre Veranstaltung die Aufmerksamkeit erhält, die sie verdient. Auch unsere Kunden erhalten regelmäßig per Newsletter alle Infos zu unseren Events."
          - title: "Lokale Kooperationen & Partnerschaften"
            text: "Durch unser starkes Netzwerk in Stuttgart und der Region schaffen wir wertvolle Kooperationen mit Unternehmen, Institutionen und Multiplikatoren, um die Reichweite Ihrer Veranstaltung zusätzlich zu erhöhen."
          - title: "Eigene Vertriebskanäle & Ticketplattformen"
            text: "Neben der Vermarktung über etablierte Ticketplattformen nutzen wir auch unsere eigenen Vertriebskanäle, um Ihre Veranstaltung optimal zu platzieren und zusätzliche Reichweite zu generieren."
          - title: "Content-Produktion"
            text: "Professioneller Content ist die Grundlage jeder erfolgreichen Kampagne. Unsere Inhouse-Grafikerin gestaltet Artworks, Social-Media-Grafiken, Anzeigen, Banner und weitere Werbemittel schnell, flexibel und aus einer Hand. Auf Wunsch produzieren wir außerdem Foto- und Videoinhalte mit unseren Kooperationspartnern für Ihre Veranstaltung."
      staff:
        title: "Personal"
        paragraphs:
          first: "Erfolgreiche Veranstaltungen entstehen durch Menschen. Deshalb stehen unsere Mitarbeiterinnen und Mitarbeiter im Mittelpunkt unseres Handelns. Ob im Auf- und Abbau, in der Logistik, im Catering, in der Sicherheit oder in der Organisation. Jede Aufgabe trägt dazu bei, dass eine Veranstaltung erfolgreich umgesetzt wird."
          second: "Mit knapp 500 eigenen Stagehands, Staplerfahrerinnen und Staplerfahrern, Cateringhilfen sowie Sicherheitskräften verfügen wir über einen der größten Personalpools für Veranstaltungen in der Region. Unsere Mitarbeitenden kennen unsere Abläufe, arbeiten eingespielt zusammen und sorgen für einen reibungslosen Veranstaltungsbetrieb."
          third: "Faire Arbeitsbedingungen und ein respektvoller Umgang sind für uns selbstverständlich. Wir bezahlen unsere Mitarbeitenden deutlich über dem gesetzlichen Mindestlohn und schaffen ein Arbeitsumfeld, das von Wertschätzung, Chancengleichheit und gegenseitigem Respekt geprägt ist. Entscheidend sind für uns Qualifikation, Engagement und Teamgeist."
          fourth: "Ein weiterer Schwerpunkt liegt auf der kontinuierlichen Aus- und Weiterbildung unseres Teams. Regelmäßige Schulungen zu aktuellen Sicherheits- und Hygienestandards gewährleisten ein hohes Qualitätsniveau und einen sicheren Einsatz auf jeder Veranstaltung. Auch bei Projekten, die gemeinsam mit externen Personaldienstleistern umgesetzt werden, profitieren unsere Kunden von den eingespielten Abläufen und der Erfahrung unseres eigenen Personals."
          fifth: "Gerne unterstützen wir Ihre Veranstaltung mit qualifiziertem Personal oder übernehmen die komplette Personalplanung und Koordination."
        deployment_title: "Unsere Einsatzbereiche"
        deployment_areas:
          - "Cateringhilfen"
          - "Stagehands"
          - "Staplerfahrer*innen"
          - "Sicherheitskräfte"
      ticketing:
        title: "Ticketportal"
        cta: "Jetzt entdecken!"
        paragraphs:
          first: "<strong>STUTTGART</strong>LIVE ist unser Ticketportal mit allen wichtigen Veranstaltungen in der Region Stuttgart: online buchen, schnell, unkompliziert und mit perfektem Service."
          second: "Die Eventdaten bleiben perspektivisch read-only angebunden. Diese Russ-live-Seite greift später nur auf freigegebene Veranstaltungsdaten zu."
