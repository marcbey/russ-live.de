<%
require File.expand_path("app/lib/hetzner_deploy_config.rb", Dir.pwd)
require File.expand_path("app/lib/deployment_environment.rb", Dir.pwd)
%>
deploy_timeout: 90
servers:
  web:
    hosts:
      - <%= HetznerDeployConfig.web_host(destination: "staging") %>
    options:
      memory: 768m
      cpus: "0.5"
    env:
      clear:
        WEB_CONCURRENCY: 1
        RAILS_MAX_THREADS: 2
        DB_POOL: 2
        QUEUE_DB_POOL: 2
  job:
    hosts:
      - <%= HetznerDeployConfig.web_host(destination: "staging") %>
    cmd: bin/jobs
    options:
      memory: 512m
      cpus: "0.25"
    env:
      clear:
        JOB_CONCURRENCY: 1
        JOB_THREADS: 1
        DB_POOL: 1
        QUEUE_DB_POOL: 3
proxy:
  ssl: true
  host: <%= HetznerDeployConfig.app_host(destination: "staging") %>
  app_port: 80
registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "marcbey") %>
  password:
    - KAMAL_REGISTRY_PUSH_TOKEN
env:
  secret:
    - RAILS_MASTER_KEY
    - MEDIA_PROXY_SECRET
    - STAGING_BASIC_AUTH_HTPASSWD
    - RUSS_LIVE_PRIMARY_DB_PASSWORD
    - RUSS_LIVE_OPERATIONAL_DB_PASSWORD
  clear:
    APP_ENVIRONMENT: staging
    SENTRY_ENVIRONMENT: staging
    SENTRY_RELEASE: <%= ENV.fetch("SENTRY_RELEASE") { `git rev-parse HEAD`.strip } %>
<% DeploymentEnvironment.staging_profile(project: "russ_live_de").each do |key, value| %>
    <%= key %>: <%= value.inspect %>
<% end %>
volumes:
  - "stuttgart_live_de_staging_storage:/rails/storage"
ssh:
  user: deploy
  keys:
    - <%= ENV.fetch("KAMAL_SSH_KEY_PATH", File.expand_path("~/.ssh/stgt-live-hetzner-github")) %>
